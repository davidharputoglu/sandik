[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sandik"
version = "0.1.0"
description = "sandik — CRM, devis et factures. Logiciel libre (AGPL-3.0)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.10"
authors = [{ name = "David HARPUTOGLU", email = "kasparof57@gmail.com" }]
maintainers = [{ name = "David HARPUTOGLU", email = "kasparof57@gmail.com" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "platformdirs>=4",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sandik = "sandik.__main__:main"

# Chaque édition (sandik, BatiPilot, ...) se déclare ici.
[project.entry-points."sandik.editions"]
sandik = "sandik.editions:SANDIK_DIR"

[tool.setuptools.packages.find]
include = ["sandik*"]

[tool.setuptools.package-data]
sandik = ["editions/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
